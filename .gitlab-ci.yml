# ================================
# DEV-TOOLS — Pipeline CI/CD
# ================================
# Self-hosted pipeline: uses local template (local:)
# because this project IS the source of the templates.
#
# Consumer projects use include:project instead.
# See .gitlab/ci/pipeline-js-package.yml for full documentation.

include:
  - local: ".gitlab/ci/pipeline-js-package.yml"

variables:
  CACHE_KEY: "js-dev-tools-v1"
  NPM_PACKAGE_NAME: "@zairakai/js-dev-tools"

  # Self-hosted mode: scripts live in this repo, not in node_modules/
  JS_DEV_TOOLS_SCRIPTS: "scripts"

# The documentation site, published with GitLab Pages from main: main ("next") and every released version,
# each built from its own tag, with a version selector. See docs/scripts/publish.sh.
pages:
  stage: build
  image: ${NODE_IMAGE}
  needs: []
  variables:
    GIT_DEPTH: 0
  before_script:
    - node --version
  script:
    - bash docs/scripts/publish.sh
  # The next jobs of the runner must not find (and lint) the docs dependencies.
  after_script:
    - rm -rf docs/node_modules docs/reference docs/guide/readme.md docs/.vitepress/dist docs/.vitepress/cache
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
