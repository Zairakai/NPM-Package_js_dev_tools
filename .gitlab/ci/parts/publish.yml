# JS PIPELINE - BUILD, PUBLISH, RELEASE AND DOCUMENTATION
# ================
# What only a package does: build it, publish it on npm, release it, publish its documentation and start the update of the
# projects that use it. An application does not include this file.
# Included by pipeline-js-package.yml.

# BUILD
# ================
js:build:
  extends: .js:node
  stage: build
  script:
    - |
      if { [ -f node_modules/.bin/tsup ] || [ -f node_modules/.bin/tsc ]; } && [ -f tsconfig.json ]; then
        bash "$JS_DEV_TOOLS_SCRIPTS/build.sh"
      else
        echo "No TypeScript builder configured - skipping (install tsup or typescript)"
      fi
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
    when: on_success
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - if: $CI_COMMIT_TAG =~ $VERSION_TAG_REGEX
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_MERGE_REQUEST_ID

# PUBLISH
# ================
js:publish:
  extends:
    - .js:base
    - .js:cache
  stage: publish
  image: ${NODE_IMAGE}
  # Trusted publishing: npm trusts this project and this job, and the OIDC token below authenticates the publication.
  # No npm token is stored anywhere. npm accepts only the shared runners of GitLab.com (not a self-hosted runner),
  # so this job is the only one that uses them. The tag is the one of GitLab, it cannot be renamed.
  tags:
    - saas-linux-small-amd64
  id_tokens:
    NPM_ID_TOKEN:
      aud: 'npm:registry.npmjs.org'
    # Lets npm sign the provenance: the package page shows it was built on GitLab from this project.
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - if: $CI_COMMIT_TAG =~ $VERSION_TAG_REGEX
  script:
    - |
      # A pre-release (2.3.0-rc.1) goes to the npm tag "next", so it never becomes "latest"
      npm_tag="latest"
      if [[ $CI_COMMIT_TAG == *-* ]]; then
        npm_tag="next"
      fi
      echo "Publishing ${NPM_PACKAGE_NAME}@${CI_COMMIT_TAG} to npm (tag ${npm_tag})..."
      npm version "${CI_COMMIT_TAG}" --no-git-tag-version --allow-same-version
      npm publish --provenance --access public --tag "${npm_tag}"
  environment:
    name: production
    url: https://www.npmjs.com/package/${NPM_PACKAGE_NAME}

# RELEASE
# ================
js:release:
  extends: .js:base
  stage: release
  image: ${RELEASE_CLI_IMAGE}
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - if: $CI_COMMIT_TAG =~ $VERSION_TAG_REGEX
  before_script:
    - apk add --no-cache bash git jq
    - git config --global --add safe.directory '*'
    - git config --global user.name "GitLab CI"
    - git config --global user.email "ci@gitlab.com"
  script:
    - |
      # Tags are listed newest first, with or without the old "v" prefix (v2.1.0 then 2.2.0)
      PREVIOUS_TAG=$(git tag | sed -E 's/^v?(.*)$/\1 &/' | sort -k1,1 -Vr | cut -d' ' -f2 | grep -A1 -Fx "${CI_COMMIT_TAG}" | tail -n 1 || echo "")
      if [[ -n "$PREVIOUS_TAG" && "$PREVIOUS_TAG" != "$CI_COMMIT_TAG" ]]; then
        COMMITS=$(git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${CI_COMMIT_TAG}" | head -20)
      else
        COMMITS="- Initial release"
      fi
      cat > release_notes.md << NOTES
      ## ${CI_COMMIT_TAG}

      ${COMMITS}
      NOTES
      release-cli create \
        --tag-name "${CI_COMMIT_TAG}" \
        --name "Release ${CI_COMMIT_TAG}" \
        --description "$(cat release_notes.md)" \
        --assets-link "{\"name\":\"npm\",\"url\":\"https://www.npmjs.com/package/${NPM_PACKAGE_NAME}/v/${CI_COMMIT_TAG}\"}"
  artifacts:
    paths:
      - release_notes.md
    expire_in: 1 year

# DOCUMENTATION
# ================
# The documentation site (GitLab Pages): every released version, each built from its own tag, and next, with a version
# selector. See docs/scripts/publish.sh in the project. It comes with the release: a tag is always a release of main, and
# nothing is published if the publication failed. The dependencies are the ones installed once by js:install.
# A project without docs/scripts/publish.sh has no site.
pages:
  extends:
    - .js:base
    - .js:cache
  stage: release
  image: ${NODE_IMAGE}
  needs:
    - job: js:install
    - job: js:publish
  variables:
    GIT_DEPTH: 0
  before_script:
    - node --version
  script:
    - bash docs/scripts/publish.sh
  # The next jobs of the runner must not find (and lint) the docs dependencies or what they generate.
  after_script:
    - rm -rf docs/node_modules docs/.vitepress/dist docs/.vitepress/cache
    - git clean -fdXq docs || true
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - if: $CI_COMMIT_TAG =~ $VERSION_TAG_REGEX
      exists:
        - docs/scripts/publish.sh

# CASCADE
# ================
# After the publication, start the update of the projects that use this package (only if the project has a cascade).
deps:cascade:
  extends: .js:base
  stage: release
  image: ${NODE_IMAGE}
  needs:
    - job: js:publish
  script:
    - '[ -d node_modules ] || npm ci --no-audit --no-fund'
    - node "${JS_DEV_TOOLS_SCRIPTS}/update-dependencies.mjs" cascade
  rules:
    - if: $CI_COMMIT_TAG =~ $VERSION_TAG_REGEX
