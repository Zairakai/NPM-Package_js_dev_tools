# PIPELINE TEMPLATE - NPM Package
# ================
# Shared pipeline template for NPM packages in the Zairakai namespace.
# The jobs are in the files of parts/, one per role, which pipeline-js-app.yml includes too (the part that an application
# needs): base (runner, variables, hidden jobs), security, quality (install, validate, quality, test), updates, and
# publish (build, publish, release, documentation, cascade: this file only).
# The files share their hidden jobs with extends:, because YAML anchors do not cross the files of an include.
#
# All job names are prefixed js: to avoid any collision with PHP or custom
# jobs when this template is combined with other templates.
#
# USAGE in a consumer project:
# ─────────────────────────────────────────
#   include:
#     - project: 'zairakai/npm-packages/js-dev-tools'
#       ref: main
#       file: '.gitlab/ci/pipeline-js-package.yml'
#
#   variables:
#     CACHE_KEY: "my-package-v2"
#     NPM_PACKAGE_NAME: "@myorg/my-package"
#
# FOR dev-tools ITSELF (self-hosted mode):
# ─────────────────────────────────────────────────────
#   include:
#     - local: '.gitlab/ci/pipeline-js-package.yml'
#
#   variables:
#     CACHE_KEY: "dev-tools-v2"
#     NPM_PACKAGE_NAME: "@zairakai/js-dev-tools"
#     JS_DEV_TOOLS_SCRIPTS: "scripts"

include:
  # security.yml first: the template of the secret detection it includes sets variables that base.yml overrides.
  - local: '.gitlab/ci/parts/security.yml'
  - local: '.gitlab/ci/parts/base.yml'
  - local: '.gitlab/ci/parts/quality.yml'
  - local: '.gitlab/ci/parts/updates.yml'
  - local: '.gitlab/ci/parts/publish.yml'

# STAGES
# ================
stages:
  - security
  - install
  - validate
  - quality
  - test
  - build
  - publish
  - release

# VARIABLES
# ================
variables:
  # ── OVERRIDE PER PROJECT ──────────────────────────────────────────────────
  CACHE_KEY: 'zairakai-npm-package'
  NPM_PACKAGE_NAME: '@zairakai/package'
